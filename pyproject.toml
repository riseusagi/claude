[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flycraft"
version = "0.1.0"
description = "ハエ（キイロショウジョウバエ）の全脳コネクトームにマインクラフト統合版（Windows）をプレイさせる"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "pyarrow>=8",
    "websockets>=10",
]

[project.optional-dependencies]
fast = ["numba>=0.57"]
all = ["numba>=0.57"]
dev = ["pytest>=7", "pygame>=2"]

[project.scripts]
flycraft = "flycraft.cli:main"

[tool.setuptools.packages.find]
include = ["flycraft*"]

[tool.setuptools.package-data]
flycraft = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
